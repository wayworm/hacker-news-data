<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Users - Hacker News Analysis</title>
    <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="static/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hacker News Analysis</h1>
            <nav class="nav-links">
                <div class="nav-item"><a href="/" class="nav-link">Keyword Trends</a></div>
                <div class="nav-item"><a href="/users" class="nav-link active">Top Users</a></div>
            </nav>
        </div>
        
        <div class="info">
            <div class="info-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="info-content">
                <p>Discover the most influential users on Hacker News based on cumulative score, total posts, and engagement metrics.</p>
            </div>
        </div>
        
        <div class="card">
            <form id="topUsersForm">
                <div class="row">
                    <div class="form-group">
                        <label for="itemType">Item Type</label>
                        <select id="itemType" name="itemType">
                            <option value="all" selected>All (Stories & Comments)</option>
                            <option value="story">Stories Only</option>
                            <option value="comment">Comments Only</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="limit">Number of Users</label>
                        <select id="limit" name="limit">
                            <option value="20">Top 20</option>
                            <option value="50">Top 50</option>
                            <option value="100" selected>Top 100</option>
                            <option value="200">Top 200</option>
                        </select>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="refresh" name="refresh">
                    <label for="refresh" style="margin-bottom: 0;">Force refresh (ignore cache)</label>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    Get Top Users
                </button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching user data...</p>
            </div>
            
            <div class="result" id="result">
                <div id="visualizations"></div>
                <div id="tableContainer"></div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <a href="https://github.com/teddy-mcdermott" target="_blank">
            <i class="fab fa-github"></i> GitHub
        </a>
        <p> | </p>
        <a href="https://www.teddymcdermott.co.uk">Teddy McDermott</a>
        <p> | </p>
    </footer>
    
    <script src="static/js/users.js"></script>
</body>
</html>
