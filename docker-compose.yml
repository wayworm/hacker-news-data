services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:     
      - hn-network 
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - hn-network
      
  web:
    build:
      context: .
      dockerfile: ./Analysis/time_series/time_series.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db 
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - hn-network
    volumes:
      - cache_data:/app/cache
      - image_data:/app/Analysis/time_series/static/images 

  scraper:
    build:
      context: .
      dockerfile: ./Scraper/Scraper.Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    depends_on:
      - db
    networks:
      - hn-network

networks:
  hn-network:
    driver: bridge


volumes:
  cache_data:
  image_data: